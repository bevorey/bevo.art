# netlify.toml
# Netlify configuration for bevo.art

[build]
  publish = "."

# Pretty URLs — /gallery instead of /pages/gallery.html
[[redirects]]
  from = "/gallery"
  to = "/pages/gallery.html"
  status = 200

[[redirects]]
  from = "/poetry"
  to = "/pages/poetry.html"
  status = 200

[[redirects]]
  from = "/music"
  to = "/pages/music.html"
  status = 200

[[redirects]]
  from = "/books"
  to = "/pages/books.html"
  status = 200

[[redirects]]
  from = "/token"
  to = "/pages/token.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache fonts and static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
